services:
  - type: web
    name: evidenceflow-langgraph
    env: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENSEARCH_URL
        sync: false
      - key: OPENSEARCH_USERNAME
        sync: false
      - key: OPENSEARCH_PASSWORD
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: RERANK_BACKEND
        value: jina
      - key: JINA_API_URL
        value: https://api.jina.ai/v1/rerank
      - key: JINA_RERANK_MODEL
        value: jina-reranker-v1-turbo-en
      - key: LLM_GATEWAY_URL
        sync: false
      - key: KATZILLA_ENABLED
        value: "true"
      - key: KATZILLA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
