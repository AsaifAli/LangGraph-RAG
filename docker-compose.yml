services:
  litellm:
    image: litellm/litellm:1.94.0
    container_name: evidenceflow-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_LITELLM_MODEL: ${OPENROUTER_LITELLM_MODEL:-openrouter/free}
      GEMINI_LITELLM_MODEL: ${GEMINI_LITELLM_MODEL:-gemini/gemini-flash-lite-latest}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.3.2
    container_name: evidenceflow-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - plugins.ml_commons.allow_registering_model_via_url=true
      - plugins.ml_commons.only_run_on_ml_node=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "19200:9200"
      - "19600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    container_name: evidenceflow-app
    ports:
      - "18501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-evidenceflow_documents}
      OPENSEARCH_NEURAL_SPARSE: ${OPENSEARCH_NEURAL_SPARSE:-true}
      OPENSEARCH_VERIFY_CERTS: "false"
      BACKEND: ${BACKEND:-litellm}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000/v1}
      LLM_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-}
      LLM_GATEWAY_MODEL: ${LLM_GATEWAY_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_LITELLM_MODEL: ${OPENROUTER_LITELLM_MODEL:-openrouter/free}
      GEMINI_LITELLM_MODEL: ${GEMINI_LITELLM_MODEL:-gemini/gemini-flash-lite-latest}
    depends_on:
      litellm:
        condition: service_started
      opensearch:
        condition: service_healthy
    volumes:
      - chat_history:/app/chat_history
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  opensearch_data:
  chat_history:
  hf_cache:
